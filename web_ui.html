<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大肥鱼AI</title>
<style>
:root{
  --bg:#131316;--card:#1c1c21;--border:#2e2e35;--text:#e8e8ea;--text2:#9a9aa3;
  --accent:#7b9aff;--hover:#26262e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  height:100dvh;display:flex;overflow:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* 侧栏 */
#side{width:230px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--card)}
#side h2{font-size:14px;font-weight:600;padding:14px 14px 10px;color:var(--text2);letter-spacing:.5px}
#newBtn{margin:0 12px 10px;padding:9px;border:1px dashed var(--border);border-radius:10px;background:transparent;
  color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
#newBtn:active{background:var(--hover)}
#list{flex:1;overflow-y:auto;padding:0 8px 12px}
.item{padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.item:active{background:var(--hover)}
.item.on{background:var(--hover);color:var(--text)}
.item .del{float:right;opacity:.4;margin-left:6px}

/* 主区 */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
#menuBtn{display:none;background:transparent;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:2px 6px}
#title{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#model{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;font-size:12px;outline:none;font-family:inherit}

#msgs{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;max-width:100%}
.row.me{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:var(--hover);display:flex;
  align-items:center;justify-content:center;font-size:15px}
.bub{max-width:min(78%,620px);padding:10px 13px;border-radius:16px;background:var(--card);
  border:1px solid var(--border);white-space:pre-wrap;word-break:break-word;font-size:15px}
.row.me .bub{background:#25305c;border-color:#33417a}
.think{font-size:12px;color:var(--text2);border-left:2px solid var(--border);padding:4px 0 4px 8px;margin-bottom:6px;white-space:pre-wrap;display:none}
.think.on{display:block}
.empty{color:var(--text2);text-align:center;font-size:13px;margin:auto;line-height:2}
.empty b{display:block;font-size:16px;color:var(--text);margin-bottom:6px}

#bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);flex-shrink:0}
#inp{flex:1;background:var(--card);border:1px solid var(--border);border-radius:18px;color:var(--text);
  padding:11px 15px;font-size:15px;font-family:inherit;outline:none;resize:none;max-height:120px;line-height:1.4}
#inp:focus{border-color:var(--accent)}
#send{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:17px;
  cursor:pointer;flex-shrink:0}
#send:disabled{opacity:.4}
.typing::after{content:'▊';animation:bl .9s infinite}
@keyframes bl{50%{opacity:0}}

@media (max-width:720px){
  #side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:.22s;box-shadow:0 0 30px #0008}
  #side.on{transform:none}
  #menuBtn{display:block}
  #mask{position:fixed;inset:0;background:#0006;z-index:10;display:none}
  #mask.on{display:block}
  .bub{max-width:84%}
}
</style>
</head>
<body>
<div id="mask" onclick="toggleSide(false)"></div>
<aside id="side">
  <h2>对话</h2>
  <button id="newBtn" onclick="newChat()">＋ 新对话</button>
  <div id="list"></div>
</aside>

<main id="main">
  <div id="top">
    <button id="menuBtn" onclick="toggleSide(true)">☰</button>
    <div id="title">大肥鱼AI</div>
    <select id="model" onchange="onModel()"></select>
  </div>
  <div id="msgs"><div class="empty"><b>大肥鱼在这儿</b>说点什么吧，鲸鱼鱼在听～</div></div>
  <div id="bar">
    <textarea id="inp" rows="1" placeholder="说点什么…" oninput="grow(this)"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();send()}"></textarea>
    <button id="send" onclick="send()">↑</button>
  </div>
</main>

<script>
let S={chats:[],models:[],model:'qwen2.5vl:7b'},CID=null,MSGS=[],busy=false;

async function api(p,opt){
  const r=await fetch(p,opt);
  return r.json();
}
function toggleSide(on){document.getElementById('side').classList.toggle('on',on);document.getElementById('mask').classList.toggle('on',on)}
function grow(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'}

async function boot(){
  S=await api('/api/state');
  const sel=document.getElementById('model');
  sel.innerHTML=S.models.map(m=>`<option value="${m.id}">${m.short}</option>`).join('');
  sel.value=S.model;
  paintList();
  if(S.chats.length){openChat(S.chats[0].id)}else{await newChat()}
}

function paintList(){
  document.getElementById('list').innerHTML=S.chats.map(c=>
    `<div class="item${c.id===CID?' on':''}" onclick="openChat('${c.id}')">
       <span class="del" onclick="event.stopPropagation();delChat('${c.id}')">✕</span>${esc(c.title)}</div>`).join('');
}

function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

async function newChat(){
  const r=await api('/api/new',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  S=await api('/api/state');paintList();await openChat(r.id);toggleSide(false);
  document.getElementById('inp').focus();
}

async function openChat(id){
  CID=id;
  const r=await api('/api/chat?id='+encodeURIComponent(id));
  MSGS=(r.ok&&r.chat.msgs)||[];
  document.getElementById('title').textContent=(r.ok&&r.chat.title)||'大肥鱼AI';
  paintList();render();toggleSide(false);
}

async function delChat(id){
  if(!confirm('删掉这个对话？'))return;
  await api('/api/del',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  S=await api('/api/state');paintList();
  if(id===CID){if(S.chats.length)openChat(S.chats[0].id);else newChat()}
}

function onModel(){S.model=document.getElementById('model').value}

function render(){
  const box=document.getElementById('msgs');
  if(!MSGS.length){box.innerHTML='<div class="empty"><b>大肥鱼在这儿</b>说点什么吧，鲸鱼鱼在听～</div>';return}
  box.innerHTML=MSGS.map(m=>{
    const me=m.role==='user';
    const th=m.think?'<div class="think on">💭 '+esc(m.think)+'</div>':'';
    const t=m.content?esc(m.content):(m.pending?'<span class="typing"></span>':'');
    return `<div class="row${me?' me':''}">
      <div class="av">${me?'🧑':'🐋'}</div>
      <div class="bub">${th}${t}</div></div>`;
  }).join('');
  box.scrollTop=box.scrollHeight;
}

async function send(){
  const inp=document.getElementById('inp'),text=inp.value.trim();
  if(!text||busy||!CID)return;
  busy=true;document.getElementById('send').disabled=true;
  inp.value='';grow(inp);
  MSGS.push({role:'user',content:text});
  MSGS.push({role:'assistant',content:'',pending:true});
  render();
  const ai=MSGS[MSGS.length-1];
  try{
    const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:CID,text,model:S.model})});
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n\n');buf=parts.pop();
      for(const p of parts){
        if(!p.startsWith('data: '))continue;
        const d=p.slice(6);
        if(d==='[DONE]')continue;
        try{const j=JSON.parse(d);
          if(j.error){ai.content='（出错了：'+j.error+'）';ai.pending=false;render();continue}
          if(j.t){ai.content+=j.t;render()}
        }catch(e){}
      }
    }
  }catch(e){ai.content='（连接断开：'+e+'）'}
  ai.pending=false;render();
  S=await api('/api/state');paintList();
  busy=false;document.getElementById('send').disabled=false;
}

boot();
</script>
</body>
</html>
