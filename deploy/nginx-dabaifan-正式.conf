# /etc/nginx/conf.d/dabaifan.conf
# 备案已通过 → 正式模式（直接整段覆盖原文件，不用再注释来注释去）
# 生效：sudo nginx -t && sudo systemctl reload nginx
#
# 站点根目录约定：/var/www/dabaifan
#   需要上传的文件：index.html / 404.html / robots.txt / assets/（可选 downloads/）
#
# 页脚备案号别忘：index.html 里 <div id="icpSlot"> 需要填上真实备案号，
# 并链接到 https://beian.miit.gov.cn —— 管局抽查就是查这一条。

server {
    listen 80;
    listen [::]:80;
    server_name dabaifan.cn www.dabaifan.cn;

    root /var/www/dabaifan;
    index index.html;
    charset utf-8;

    # 备案核验、证书签发需要，别拦
    location ^~ /.well-known/ { allow all; }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
    gzip_comp_level 5;

    # 图片缓存 30 天，HTML 不缓存（改完立刻生效）
    location ~* \.(png|jpg|jpeg|ico|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location ~* \.(exe|zip|apk|gguf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 统一目录：/a → /a/，避免相对路径裂开
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/dabaifan.access.log;
    error_log  /var/log/nginx/dabaifan.error.log;
}

# ---------- HTTPS（拿到备案号后就该签，浏览器不再报「不安全」）----------
# 1) sudo apt install -y certbot python3-certbot-nginx
# 2) sudo certbot --nginx -d dabaifan.cn -d www.dabaifan.cn
#    certbot 会自己改写上面这段、加上 443 和 80→443 跳转，不要手写。
#
# 签完验证：
#   curl -sI https://dabaifan.cn | head -1        # 期望 HTTP/2 200
#   echo | openssl s_client -connect dabaifan.cn:443 -servername dabaifan.cn 2>/dev/null | openssl x509 -noout -dates
#
# 若走阿里云 OSS/CDN 而非自建服务器，证书在 CDN 控制台「HTTPS 证书」里申请免费证书，
# 不要用 certbot。
