# /etc/nginx/conf.d/dabaifan.conf
# 用法：备案期间用「备案模式」，通过后切「正式模式」（两段都留着，注释切换即可）
# 生效：sudo nginx -t && sudo systemctl reload nginx

# ---------- 备案模式（管局审核期间必须用这段） ----------
# 管局巡检时如果看到完整站点，会直接驳回。所以审核期只放一个 "网站备案中" 的静态页。
server {
    listen 80;
    listen [::]:80;
    server_name dabaifan.cn www.dabaifan.cn;

    root /var/www/dabaifan;
    index beian.html;
    charset utf-8;

    # 备案核验、证书签发需要，别拦
    location ^~ /.well-known/ { allow all; }

    location / {
        try_files /beian.html =404;
    }

    access_log /var/log/nginx/dabaifan.access.log;
    error_log  /var/log/nginx/dabaifan.error.log;
}

